name: Publish

permissions:
  contents: read

on:
  push:
    tags:
      - v[0-9]+.*
      - test-release.*

jobs:
  publish-crates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@fb523f40495206854c36b250850817ae0f83e3d1 # v1.99.0
        with:
          components: rustfmt
      - uses: taiki-e/install-action@6887963ccf37a9ddcd8c5fa4baeb3e1e5fd61fa1 # v2.81.2
        with:
          tool: cargo-release
      - name: Install native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update -y
          sudo apt install -y {binutils,gcc}-{aarch64,riscv64}-linux-gnu \
          build-essential autopoint gettext libelf-dev zlib1g-dev libseccomp-dev \
          protobuf-compiler
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo release -x --no-confirm --workspace --no-tag --no-push --allow-branch HEAD --exclude perfetto-trace-proto